<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Báo cáo đơn hàng | ThucPhamKhoe.com</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .report-container {
      max-width: 500px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.07);
      padding: 2rem;
    }
    .report-header {
      margin-bottom: 1.5rem;
    }
    .report-header h2 {
      margin-bottom: 0.5rem;
    }
    .report-form label {
      display: block;
      margin-bottom: 0.7rem;
      font-weight: 500;
    }
    .report-form .options {
      margin-bottom: 1.2rem;
    }
    .report-form textarea {
      width: 100%;
      min-height: 80px;
      border-radius: 6px;
      border: 1px solid #b7e4c7;
      padding: 0.6rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      resize: vertical;
    }
    .report-form button {
      background: #d90429;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .report-form button:hover {
      background: #a8001c;
    }
    .success-message {
      color: #2d6a4f;
      font-weight: 600;
      margin-top: 1.2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="img/logo.png" alt="Logo" style="height:60px;vertical-align:middle;"> <span style="font-size:2rem;font-weight:bold;margin-left:0.5rem;vertical-align:middle;">ThucPhamKhoe</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Trang chủ</a></li>
        <li><a href="products.html">Sản phẩm</a></li>
        <li><a href="articles.html">Bài viết</a></li>
        <li><a href="cart.html">Giỏ hàng</a></li>
        <li><a href="login.html">Đăng nhập</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="report-container">
      <div class="report-header" id="report-header"></div>
      <form class="report-form" id="report-form">
        <label>Vấn đề bạn gặp phải với đơn hàng này:</label>
        <div class="options">
          <label><input type="radio" name="problem" value="Sản phẩm bị hỏng" required> Sản phẩm bị hỏng</label>
          <label><input type="radio" name="problem" value="Thiếu sản phẩm"> Thiếu sản phẩm</label>
          <label><input type="radio" name="problem" value="Giao hàng trễ"> Giao hàng trễ</label>
          <label><input type="radio" name="problem" value="Khác"> Khác (ghi chú bên dưới)</label>
        </div>
        <textarea name="note" placeholder="Mô tả chi tiết vấn đề hoặc góp ý thêm..."></textarea>
        <button type="submit">Gửi báo cáo</button>
      </form>
      <div class="success-message" id="success-message" style="display:none;">Cảm ơn bạn đã gửi báo cáo! Chúng tôi sẽ xử lý sớm nhất.</div>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 ThucPhamKhoe.com – Website thực phẩm dinh dưỡng</p>
  </footer>
  <script>
    function getOrderIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }
    const orderId = getOrderIdFromUrl();
    document.getElementById('report-header').innerHTML = `<h2>Báo cáo đơn hàng #${orderId}</h2>`;
    document.getElementById('report-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('report-form').style.display = 'none';
      document.getElementById('success-message').style.display = 'block';
    });
    // Update nav for login/profile
    (function() {
      const nav = document.querySelector('nav ul');
      if (!nav) return;
      const user = localStorage.getItem('user');
      const loginLi = Array.from(nav.children).find(li => li.textContent.includes('Đăng nhập'));
      if (user && loginLi) {
        loginLi.innerHTML = '<a href="profile.html">Hồ sơ</a>';
      } else if (!user && loginLi) {
        loginLi.innerHTML = '<a href="login.html">Đăng nhập</a>';
      }
    })();
  </script>
</body>
</html>
