<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <title>Chi tiết sản phẩm | ThucPhamKhoe.com</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .product-detail-container {
      max-width: 700px;
      margin: 2rem auto;
      padding: 2rem;
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }
    .product-detail-image {
      width: 320px;
      aspect-ratio: 4 / 3;
      height: auto;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #95d5b2;
    }
    .product-detail-info {
      flex: 1;
    }
    .product-detail-name {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 0.7rem;
    }
    .product-detail-price {
      font-size: 2rem;
      color: #d90429;
      font-weight: bold;
      margin: 0.5rem 0 1rem 0;
    }
    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .quantity-btn {
      background: #40916c;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .quantity-btn:hover {
      background: #2d6a4f;
    }
    .quantity-input {
      width: 48px;
      text-align: center;
      font-size: 1.3rem;
      border: 1px solid #b7e4c7;
      border-radius: 6px;
      padding: 0.3rem 0.2rem;
      margin: 0 0.2rem;
    }
    .add-cart-btn {
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
      margin: 0 auto;
      justify-content: center;
    }
    .add-cart-btn:hover {
      background: #40916c;
    }
    .add-cart-btn .cart-icon {
      font-size: 1.7rem;
      vertical-align: middle;
    }
    .expert-review-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }
    .expert-review-section h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .expert-review-section .review-text {
      font-style: italic;
      color: #555;
    }
  </style>
</head>

    <nav>
      <ul>

      </ul>

  <main>
    <div class="product-detail-container" id="product-detail" style="display:flex;gap:2rem;align-items:flex-start;width:100%;max-width:none;">
      <div style="flex:1;">
        <img id="product-image" alt="Product Image" class="product-detail-image" style="width:100%;height:auto;">
      </div>
      <div class="product-detail-info" style="flex:1;display:flex;flex-direction:column;gap:0.3rem;">
        <div class="product-detail-name" id="product-name" style="margin-bottom:0.1rem;"></div>
        <div class="product-detail-price" id="product-price" style="margin-top:0;margin-bottom:0.3rem;"></div>
        <div><strong>Mô tả</strong><br><span id="product-description"></span><br><span id="product-detail-desc"></span></div>
        <div style="margin-top:1rem;">
          <div style="font-weight:bold;">Đánh giá chuyên gia</div>
          <div id="expert-review"></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;margin-top:1.5rem;width:100%;">
          <div id="total-price" style="font-size:1.1rem;font-weight:500;margin-bottom:0.7rem;"></div>
          <div class="quantity-selector">

            <input class="quantity-input" id="detail-qty" type="number" value="1" min="1">
            <button class="quantity-btn" onclick="incrementDetail()">+</button>
          </div>
          <button class="add-cart-btn" style="width:100%;max-width:320px;font-size:1.5rem;padding:0.8rem 0;display:flex;align-items:center;justify-content:center;margin-top:1rem;">
            <span class="cart-icon" style="font-size:2rem;margin-right:0.7rem;">🛒</span>Thêm vào giỏ
          </button>
        </div>
      </div>
    </div>
  </main>

    function getProductIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }
    const productId = getProductIdFromUrl();
    const product = products[productId];
    const detailDiv = document.getElementById('product-detail');
    if (product) {
      document.getElementById('product-image').src = product.img;
      document.getElementById('product-image').alt = product.name;
      document.getElementById('product-name').textContent = product.name;
      document.getElementById('product-price').textContent = product.price;
      document.getElementById('product-description').textContent = product.desc;
      document.getElementById('expert-review').textContent = product.review;
    } else {
      detailDiv.innerHTML = '<div style="font-size:1.3rem;color:#d90429;">Không tìm thấy sản phẩm.</div>';
    }
    function updateTotalPrice() {
      const qty = parseInt(document.getElementById('detail-qty').value) || 1;
      const priceStr = product.price.replace(/[^\d]/g, '');
      const price = parseInt(priceStr);
      const total = qty * price;
      document.getElementById('total-price').textContent = 'Tổng thanh toán: ' + total.toLocaleString('vi-VN') + 'đ';
    }
    document.getElementById('detail-qty').addEventListener('input', updateTotalPrice);
    function decrementDetail() {
      var input = document.getElementById('detail-qty');
      var value = parseInt(input.value);
      if (value > 1) input.value = value - 1;
      updateTotalPrice();
    }
    function incrementDetail() {
      var input = document.getElementById('detail-qty');
      var value = parseInt(input.value);
      input.value = value + 1;
      updateTotalPrice();
    }
    updateTotalPrice();
  </script>
  <script>
    (function() {
      const nav = document.querySelector('nav ul');
      if (!nav) return;
      const user = localStorage.getItem('user');
      const loginLi = Array.from(nav.children).find(li => li.textContent.includes('Đăng nhập'));
      if (user && loginLi) {
        loginLi.innerHTML = '<a href="profile.html">Hồ sơ</a>';
      } else if (!user && loginLi) {
        loginLi.innerHTML = '<a href="login.html">Đăng nhập</a>';
      }
    })();
  </script>
