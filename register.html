<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký - ThucPhamKhoe.com</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f9f9f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-container {
      background: white;
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 370px;
      text-align: center;
    }
    .register-container h2 {
      margin-bottom: 1.5rem;
      color: #2d6a4f;
      font-size: 2rem;
      font-weight: 700;
    }
    .register-container form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .register-container input[type="text"],
    .register-container input[type="email"],
    .register-container input[type="password"] {
      padding: 0.7rem;
      border: 1px solid #b7e4c7;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .register-container input:focus {
      border: 1.5px solid #40916c;
    }
    .register-container button {
      padding: 0.7rem;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .register-container button:hover {
      background: #40916c;
    }
    .register-container .back-link {
      display: block;
      margin-top: 1.2rem;
      color: #40916c;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .register-container .back-link:hover {
      color: #2d6a4f;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Đăng ký tài khoản</h2>
    <form>
      <input type="text" placeholder="Họ tên" required />
      <input type="email" placeholder="Email" required />
      <input type="password" placeholder="Mật khẩu" required />
      <input type="password" placeholder="Xác nhận mật khẩu" required />
      <button type="submit">Đăng ký</button>
    </form>
    <a href="login.html" class="back-link">Đã có tài khoản? Đăng nhập</a>
    <a href="index.html" class="back-link">&larr; Quay lại trang chủ</a>
  </div>
</body>
</html>
