<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - ThucPhamKhoe.com</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #f9f9f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    .login-container h2 {
      margin-bottom: 1.5rem;
      color: #2d6a4f;
      font-size: 2rem;
      font-weight: 700;
    }
    .login-container form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .login-container input[type="email"],
    .login-container input[type="password"] {
      padding: 0.7rem;
      border: 1px solid #b7e4c7;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .login-container input:focus {
      border: 1.5px solid #40916c;
    }
    .login-container button {
      padding: 0.7rem;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-container button:hover {
      background: #40916c;
    }
    .login-container .back-link {
      display: block;
      margin-top: 1.2rem;
      color: #40916c;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.2s;
    }
    .login-container .back-link:hover {
      color: #2d6a4f;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Đăng nhập</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Mật khẩu" required />
      <button type="submit">Đăng nhập</button>
    </form>
    <a href="register.html" class="back-link">Chưa có tài khoản? Đăng ký</a>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (email === 'admin@gmail.com' && password === '123456') {
        localStorage.setItem('user', JSON.stringify({
          name: 'Admin',
          email: 'admin@gmail.com',
          role: 'admin',
          avatar: 'https://randomuser.me/api/portraits/men/1.jpg'
        }));
        window.location.href = 'admin-dashboard.html';
      } else if (email === 'expert@gmail.com' && password === '123456') {
        localStorage.setItem('user', JSON.stringify({
          name: 'Chuyên gia Dinh dưỡng',
          email: 'expert@gmail.com',
          role: 'expert',
          avatar: 'https://randomuser.me/api/portraits/men/65.jpg'
        }));
        window.location.href = 'expert-dashboard.html';
      } else if (email === 'nguyenvana@email.com' && password === '123456') {
        localStorage.setItem('user', JSON.stringify({
          name: 'Nguyễn Văn A',
          email: 'nguyenvana@email.com',
          role: 'Khách hàng',
          created: '01/01/2024',
          avatar: 'https://randomuser.me/api/portraits/men/32.jpg'
        }));
        window.location.href = 'index.html';
      } else {
        alert('Email hoặc mật khẩu không đúng!');
      }
    });
  </script>
</body>
</html>
