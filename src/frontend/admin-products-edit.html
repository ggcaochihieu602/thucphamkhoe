<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sửa sản phẩm | Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, 'Tahoma', 'Verdana', sans-serif; background: #f6f7fb; }
    .admin-header {
      background: #22223b;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-main {
      max-width: 980px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 16px rgba(0,0,0,0.07);
      padding: 2rem;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem 1.2rem;
    }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #333;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .field textarea { min-height: 110px; resize: vertical; }
    .field input:focus, .field textarea:focus {
      border-color: #40916c;
      box-shadow: 0 0 0 3px rgba(64,145,108,0.12);
    }
    .thumb {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: 1rem;
      border: 1px dashed #ddd;
      border-radius: 10px;
      background: #fafafa;
      margin-bottom: 1rem;
    }
    .thumb img {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
      background: #fff;
    }
    .actions {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .btn.primary { background: #40916c; color: #fff; }
    .btn.primary:hover { background: #2d6a4f; }
    .btn.ghost { background: #eef2ff; color: #22223b; }
    .btn.ghost:hover { background: #e0e7ff; }
    .msg { margin-top: 0.8rem; font-size: 0.95rem; color: #d90429; }
    .msg.ok { color: #2d6a4f; }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="logo"><b>Admin Panel</b></div>
    <button
      id="logout-btn"
      style="background:#d90429;color:#fff;border:none;padding:0.5rem 1.2rem;border-radius:6px;font-weight:500;cursor:pointer;font-size:1rem;"
    >
      ĐĒng xuất
    </button>
  </header>

  <main class="admin-main">
    <h1>Sửa sản phẩm</h1>
    <div id="page-msg" class="msg"></div>

    <div class="thumb" id="thumb-box" style="display:none;">
      <img id="thumb-img" src="" alt="Ảnh sản phẩm">
      <div>
        <div><b id="thumb-name"></b></div>
        <div style="font-size:0.9rem;color:#666;">ID: <span id="thumb-id"></span></div>
        <div style="font-size:0.9rem;color:#666;display:none;">Ảnh DB: <span id="thumb-file"></span></div>
      </div>
    </div>

    <form id="edit-form" style="display:none;">
      <div class="row">
        <div class="field">
          <label for="name">Tên sản phẩm</label>
          <input id="name" type="text" required />
        </div>
        <div class="field">
          <label for="price">Giá (VND)</label>
          <input id="price" type="number" min="0" required />
        </div>
        <div class="field">
          <label for="category">Loại (category)</label>
          <select id="category">
            <option value="Rau xanh">Rau xanh</option>
            <option value="Củ quả">Củ quả</option>
            <option value="Ngi c�c">Ngi c�c</option>
            <option value="Sữa">Sữa</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
        <div class="field">
          <label for="image_url">Image URL / Tên file ảnh</label>
          <input id="image_url" type="text" placeholder="Ví dụ: spinach.jpg" />
          <div style="margin-top:0.55rem;">
            <input id="image_file" type="file" accept=".jpg,.jpeg,.png" />
          </div>
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label for="description">Mô tả</label>
          <textarea id="description" placeholder="Mô tả sản phẩm..."></textarea>
        </div>

        <div class="field">
          <label for="calories">Calories (kcal)</label>
          <input id="calories" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="protein">Protein (g)</label>
          <input id="protein" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="fat">Fat (g)</label>
          <input id="fat" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="carbs">Carbs (g)</label>
          <input id="carbs" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="sodium">Natri (mg)</label>
          <input id="sodium" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="sugar">Đường (g)</label>
          <input id="sugar" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="saturated_fat">Chất béo bão hòa (g)</label>
          <input id="saturated_fat" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="fiber">Chất xơ (g)</label>
          <input id="fiber" type="number" step="0.01" min="0" />
        </div>
        <div class="field">
          <label for="cholesterol">Cholesterol (mg)</label>
          <input id="cholesterol" type="number" step="0.01" min="0" />
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" type="button" id="back-btn">� � Quay lại</button>
        <button class="btn primary" type="submit" id="save-btn">Lưu thay ��"i</button>
      </div>
      <div id="form-msg" class="msg"></div>
    </form>
  </main>

  <script>
    const API_BASE = "http://localhost:3000";
    const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
    const token = localStorage.getItem("token") || "";

    if (currentUser.role !== "admin") {
      window.location.href = "login.html";
    }

    document.getElementById("logout-btn").onclick = function () {
      localStorage.removeItem("user");
      localStorage.removeItem("token");
      window.location.href = "index.html";
    };

    document.getElementById("back-btn").onclick = function () {
      window.location.href = "admin-products.html";
    };

    function getIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function buildImageUrl(imagePath) {
      if (!imagePath) return "img/vegetable.jpg";
      if (imagePath.startsWith("http://") || imagePath.startsWith("https://")) return imagePath;
      if (imagePath.startsWith("/img/")) return API_BASE + imagePath;
      if (imagePath.startsWith("img/")) return API_BASE + "/" + imagePath;
      // nếu user ch�0 nhập "spinach.jpg" thì map vào folder products
      const p = imagePath.includes("/") ? imagePath : ("products/" + imagePath);
      return API_BASE + "/img/" + p;
    }

    function setMsg(id, text, ok) {
      const el = document.getElementById(id);
      el.textContent = text || "";
      el.classList.toggle("ok", !!ok);
    }

    function parseNumberOrNull(v) {
      const s = String(v || "").trim();
      if (!s) return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    async function loadProduct(id) {
      const res = await fetch(API_BASE + "/products/" + encodeURIComponent(id));
      const data = await res.json();
      if (!data.ok || !data.product) throw new Error(data.message || "Không tải �ược sản phẩm");
      return data.product;
    }

    async function saveProduct(id, payload, imageFile) {
      if (!token) throw new Error("Thiếu token admin, hãy �Ēng nhập lại");
      const fd = new FormData();
      Object.keys(payload || {}).forEach((k) => {
        const v = payload[k];
        fd.append(k, v === null || v === undefined ? "" : String(v));
      });
      if (imageFile) {
        fd.append("image", imageFile);
      }
      const res = await fetch(API_BASE + "/admin/products/" + encodeURIComponent(id), {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token
        },
        body: fd
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.message || "Lưu thất bại");
      return data;
    }

    function fillForm(p) {
      document.getElementById("name").value = p.name || "";
      document.getElementById("price").value = p.price != null ? p.price : "";
      const catEl = document.getElementById("category");
      const catValue = String(p.category || "").trim() || "Khác";
      const hasOption = Array.from(catEl.options || []).some(o => o.value === catValue);
      if (!hasOption) {
        const opt = document.createElement("option");
        opt.value = catValue;
        opt.textContent = catValue;
        catEl.appendChild(opt);
      }
      catEl.value = catValue;
      document.getElementById("image_url").value = p.image_url || "";
      document.getElementById("description").value = p.description || "";

      document.getElementById("calories").value = p.calories != null ? p.calories : "";
      document.getElementById("protein").value = p.protein != null ? p.protein : "";
      document.getElementById("fat").value = p.fat != null ? p.fat : "";
      document.getElementById("carbs").value = p.carbs != null ? p.carbs : "";
      document.getElementById("sodium").value = p.sodium != null ? p.sodium : "";
      document.getElementById("sugar").value = p.sugar != null ? p.sugar : "";
      document.getElementById("saturated_fat").value = p.saturated_fat != null ? p.saturated_fat : "";
      document.getElementById("fiber").value = p.fiber != null ? p.fiber : "";
      document.getElementById("cholesterol").value = p.cholesterol != null ? p.cholesterol : "";

      const imgSrc = buildImageUrl(p.image_url);
      document.getElementById("thumb-img").src = imgSrc;
      document.getElementById("thumb-name").textContent = p.name || "";
      document.getElementById("thumb-id").textContent = p.id;
      document.getElementById("thumb-file").textContent = p.image_url || "(tr�ng)";
      document.getElementById("thumb-box").style.display = "flex";
    }

    (async function init() {
      const id = getIdFromUrl();
      if (!id) {
        setMsg("page-msg", "Thiếu tham s� id. Hãy quay lại danh sách và bấm Sửa.", false);
        return;
      }
      setMsg("page-msg", "Đang tải sản phẩm...", false);
      try {
        const p = await loadProduct(id);
        fillForm(p);
        document.getElementById("edit-form").style.display = "block";
        setMsg("page-msg", "", false);
      } catch (e) {
        setMsg("page-msg", e.message || "Không tải �ược sản phẩm", false);
      }
    })();

    document.getElementById("image_url").addEventListener("input", function () {
      const img = document.getElementById("thumb-img");
      if (!img) return;
      const v = this.value.trim();
      img.src = buildImageUrl(v);
      document.getElementById("thumb-file").textContent = v || "(tr�ng)";
    });

    document.getElementById("image_file").addEventListener("change", function () {
      const f = this.files && this.files[0];
      const img = document.getElementById("thumb-img");
      if (!img) return;
      if (!f) return;
      img.src = URL.createObjectURL(f);
      document.getElementById("thumb-file").textContent = "Ảnh m�:i: " + f.name;
    });

    document.getElementById("name").addEventListener("input", function () {
      const el = document.getElementById("thumb-name");
      if (el) el.textContent = this.value || "";
    });

    document.getElementById("edit-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const id = getIdFromUrl();
      if (!id) return;

      setMsg("form-msg", "", false);
      const payload = {
        name: document.getElementById("name").value.trim(),
        price: parseNumberOrNull(document.getElementById("price").value),
        category: document.getElementById("category").value.trim(),
        image_url: document.getElementById("image_url").value.trim(),
        description: document.getElementById("description").value.trim(),
        calories: parseNumberOrNull(document.getElementById("calories").value),
        protein: parseNumberOrNull(document.getElementById("protein").value),
        fat: parseNumberOrNull(document.getElementById("fat").value),
        carbs: parseNumberOrNull(document.getElementById("carbs").value),
        sodium: parseNumberOrNull(document.getElementById("sodium").value),
        sugar: parseNumberOrNull(document.getElementById("sugar").value),
        saturated_fat: parseNumberOrNull(document.getElementById("saturated_fat").value),
        fiber: parseNumberOrNull(document.getElementById("fiber").value),
        cholesterol: parseNumberOrNull(document.getElementById("cholesterol").value)
      };

      // chuẩn hóa nếu user ch�0 nhập "spinach.jpg" => "products/spinach.jpg"
      if (payload.image_url && !payload.image_url.includes("/") &&
          !payload.image_url.startsWith("http://") &&
          !payload.image_url.startsWith("https://")) {
        payload.image_url = "products/" + payload.image_url;
      }

      if (!payload.name || payload.price === null) {
        setMsg("form-msg", "Tên và giá sản phẩm là bắt buộc.", false);
        return;
      }

      setMsg("form-msg", "Đang lưu...", false);
      try {
        const imageFile = document.getElementById("image_file").files[0];
        await saveProduct(id, payload, imageFile);
        setMsg("form-msg", "Lưu thay đổi thành công.", true);
      } catch (err) {
        setMsg("form-msg", err.message || "Lưu thất bại", false);
      }
    });
  </script>
</body>
</html>
