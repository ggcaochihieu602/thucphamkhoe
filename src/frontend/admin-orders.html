<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý đơn hàng | Admin</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, 'Tahoma', 'Verdana', sans-serif; }
    .admin-header { background: #22223b; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .admin-nav ul { list-style: none; display: flex; gap: 1.5rem; }
    .admin-nav a { color: #fff; text-decoration: none; font-weight: 500; }
    .admin-nav a:hover { text-decoration: underline; }
    .admin-main { max-width: 900px; margin: 2rem auto; background: #fff; border-radius: 10px; box-shadow: 0 0 16px rgba(0,0,0,0.07); padding: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
    th, td { border: 1px solid #eee; padding: 0.7rem 0.5rem; text-align: left; }
    th { background: #f1f1f1; }
    .action-btn { background: #40916c; color: #fff; border: none; border-radius: 5px; padding: 0.3rem 1rem; margin-right: 0.5rem; cursor: pointer; }
    .action-btn.cancel { background: #d90429; }

    .message { margin-top: 0.8rem; color: #d00000; font-size: 0.95rem; }

    /* modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 999;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(920px, 96vw);
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }
    .modal-head h3 { margin: 0; font-size: 1.1rem; }
    .modal-close {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      color: #444;
    }
    .modal-body { padding: 1rem 1.2rem 1.2rem 1.2rem; }
    .meta { color: #555; font-size: 0.95rem; margin: 0.25rem 0; }
    .items-table { width: 100%; border-collapse: collapse; margin-top: 0.8rem; }
    .items-table th, .items-table td { border: 1px solid #eee; padding: 0.6rem 0.45rem; }
    .items-table th { background: #f6f6f6; }
    .thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; border: 1px solid #eee; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="logo"><b>Admin Panel</b></div>
    <nav class="admin-nav">
      <ul>
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="admin-products.html">Sản phẩm</a></li>
        <li><a href="admin-orders.html">Đơn hàng</a></li>
        <li><a href="admin-users.html">Người dùng</a></li>
        <li><a href="admin-transactions.html">Giao dịch</a></li>
        <li><a href="admin-support.html">Hỗ trợ</a></li>
      </ul>
    </nav>
    <div>
      <a href="profile.html" id="admin-profile-btn" style="background:#fff;color:#22223b;border:1px solid #fff;padding:0.45rem 1rem;border-radius:6px;font-weight:600;margin-right:0.6rem;text-decoration:none;">Hồ sơ</a>
      <button id="logout-btn" style="background:#d90429;color:#fff;border:none;padding:0.5rem 1.2rem;border-radius:6px;font-weight:500;cursor:pointer;font-size:1rem;">Đăng xuất</button>
    </div>
  </header>

  <main class="admin-main">
    <h1>Quản lý đơn hàng</h1>
    <table>
      <thead>
        <tr><th>Mã đơn</th><th>Khách hàng</th><th>Ngày đặt</th><th>Trạng thái</th><th>Hành động</th></tr>
      </thead>
      <tbody id="orders-tbody">
        <tr><td colspan="5">Đang tải...</td></tr>
      </tbody>
    </table>
    <div id="orders-message" class="message"></div>
  </main>

  <div class="modal-backdrop" id="order-modal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modal-title">Chi tiết đơn hàng</h3>
        <button class="modal-close" id="modal-close" title="Đóng">×</button>
      </div>
      <div class="modal-body" id="modal-body">
        Đang tải...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3000";
    const user = JSON.parse(localStorage.getItem("user") || "{}");
    const token = localStorage.getItem("token") || "";

    if (user.role !== "admin") window.location.href = "login.html";

const logoutBtn = document.getElementById("logout-btn");
if (logoutBtn) {
  logoutBtn.onclick = function () {
    localStorage.removeItem("user");
    localStorage.removeItem("token");
    window.location.href = "login.html";
  };
}

    const tbody = document.getElementById("orders-tbody");
    const msgEl = document.getElementById("orders-message");

    function formatMoney(v, product) {
      const n = Number(v || 0);
      if (!n) return "Liên hệ";
      let unit = "kg";
      if (product && product.price_unit) {
        const parts = product.price_unit.split("/");
        unit = parts[parts.length - 1] || "kg";
      }
      return n.toLocaleString("vi-VN") + "đ/" + unit;
    }

    function formatMoneyPlain(n) {
      return Number(n || 0).toLocaleString("vi-VN") + "đ";
    }

    function formatDateTime(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleString("vi-VN");
    }

    function formatStatus(st) {
      const s = String(st || "").toLowerCase();
      if (s === "pending" || s === "processing") return "Đang xử lý";
      if (s === "shipping") return "Đang vận chuyển";
      if (s === "cancelled_by_admin") return "Đã hủy";
      if (s === "cancelled" || s === "canceled") return "Đã hủy";
      if (s === "delivered") return "Đã giao";
      return st || "";
    }

    function statusOptionsHtml(selected) {
      const s = String(selected || "").toLowerCase();
      const opts = [
        { v: "pending", t: "Đang xử lý" },
        { v: "shipping", t: "Đang vận chuyển" },
        { v: "delivered", t: "Đã giao" }
      ];
      return opts
        .map(o => `<option value="${o.v}" ${o.v === s ? "selected" : ""}>${o.t}</option>`)
        .join("");
    }

    function openModal(html, title) {
      document.getElementById("modal-title").textContent = title || "Chi tiết đơn hàng";
      document.getElementById("modal-body").innerHTML = html || "";
      document.getElementById("order-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("order-modal").classList.remove("open");
    }

    document.getElementById("modal-close").onclick = closeModal;
    document.getElementById("order-modal").addEventListener("click", function (e) {
      if (e.target.id === "order-modal") closeModal();
    });

    function buildImageUrl(imagePath) {
      if (!imagePath) return "img/vegetable.jpg";
      if (imagePath.startsWith("http://") || imagePath.startsWith("https://")) return imagePath;
      if (imagePath.startsWith("/img/")) return API_BASE + imagePath;
      if (imagePath.startsWith("img/")) return API_BASE + "/" + imagePath;
      return API_BASE + "/img/" + imagePath;
    }

    async function loadOrders() {
      msgEl.textContent = "";
      tbody.innerHTML = "<tr><td colspan='5'>Đang tải...</td></tr>";
      try {
        const res = await fetch(API_BASE + "/admin/orders", {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.ok) {
          tbody.innerHTML = "";
          msgEl.textContent = data.message || "Lỗi khi tải đơn hàng";
          return;
        }
        const orders = data.orders || [];
        if (orders.length === 0) {
          tbody.innerHTML = "<tr><td colspan='5'>Chưa có đơn hàng nào.</td></tr>";
          return;
        }
        tbody.innerHTML = orders.map(o => {
          const s = String(o.status || "").toLowerCase();
          const locked = s === "delivered" || s === "cancelled" || s === "canceled" || s === "cancelled_by_admin";
          const cancelDisabled = locked ? "disabled" : "";
          const cancelStyle = locked ? "opacity:0.55;cursor:not-allowed;" : "";
          const updateHtml = locked
            ? ""
            : `
              <div style="margin-top:0.45rem;display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center;">
                <select data-role="status" style="padding:0.35rem 0.45rem;border-radius:6px;border:1px solid #ddd;">
                  ${statusOptionsHtml(o.status)}
                </select>
                <button class="action-btn" data-action="update-status" style="background:#22223b;">Cập nhật</button>
              </div>
            `;

          return `
            <tr data-id="${o.id}">
              <td>#${o.id}</td>
              <td>${o.user_name || ""}<div style="font-size:0.85rem;color:#777;">${o.user_email || ""}</div></td>
              <td>${formatDateTime(o.created_at)}</td>
              <td>${formatStatus(o.status)}</td>
              <td>
                <button class="action-btn" data-action="view">Xem</button>
                <button class="action-btn cancel" data-action="cancel" ${cancelDisabled} style="${cancelStyle}">Hủy đơn hàng</button>
                ${updateHtml}
              </td>
            </tr>
          `;
        }).join("");
      } catch (e) {
        tbody.innerHTML = "";
        msgEl.textContent = "Không kết nối được tới API";
      }
    }

    async function viewOrder(orderId) {
      openModal("Đang tải...", "Chi tiết đơn hàng #" + orderId);
      try {
        const res = await fetch(API_BASE + "/admin/orders/" + encodeURIComponent(orderId), {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.ok) {
          openModal('<div style="color:#d00000;">' + (data.message || "Lỗi khi tải chi tiết") + "</div>", "Chi tiết đơn hàng #" + orderId);
          return;
        }
        const o = data.order;
        const items = data.items || [];
        const rows = items.map(it => {
          const img = buildImageUrl(it.image_url);
          const line = Number(it.unit_price || 0) * Number(it.quantity || 0);
          return `
            <tr>
              <td><img class="thumb" src="${img}" alt="${it.name || ""}"></td>
              <td>${it.name || ""}</td>
              <td>${it.quantity || 0}</td>
              <td>${formatMoney(it.unit_price, it)}</td>
              <td>${formatMoneyPlain(line)}</td>
            </tr>
          `;
        }).join("");

        const html = `
          <div class="meta"><b>Khách hàng:</b> ${o.user_name || ""} (${o.user_email || ""})</div>
          <div class="meta"><b>Ngày đặt:</b> ${formatDateTime(o.created_at)}</div>
          <div class="meta"><b>Trạng thái:</b> ${formatStatus(o.status)}</div>
          <div class="meta"><b>Tổng tiền:</b> ${formatMoney(o.total_price)}</div>
          <table class="items-table">
            <thead>
              <tr><th>Ảnh</th><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr>
            </thead>
            <tbody>${rows || "<tr><td colspan='5'>Không có sản phẩm.</td></tr>"}</tbody>
          </table>
        `;
        openModal(html, "Chi tiết đơn hàng #" + orderId);
      } catch (e) {
        openModal('<div style="color:#d00000;">Không kết nối được tới API</div>', "Chi tiết đơn hàng #" + orderId);
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm("Hủy đơn hàng #" + orderId + "?")) return;
      msgEl.textContent = "";
      try {
        const res = await fetch(API_BASE + "/admin/orders/" + encodeURIComponent(orderId) + "/cancel", {
          method: "PUT",
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        if (!data.ok) {
          msgEl.textContent = data.message || "Hủy đơn hàng thất bại";
          return;
        }
        msgEl.style.color = "#2d6a4f";
        msgEl.textContent = data.message || "Đã hủy đơn hàng";
        await loadOrders();
      } catch (e) {
        msgEl.textContent = "Không kết nối được tới API";
      }
    }

    async function updateOrderStatus(orderId, status) {
      msgEl.textContent = "";
      try {
        const res = await fetch(API_BASE + "/admin/orders/" + encodeURIComponent(orderId) + "/status", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (!data.ok) {
          msgEl.textContent = data.message || "Cập nhật trạng thái thất bại";
          return;
        }
        msgEl.style.color = "#2d6a4f";
        msgEl.textContent = data.message || "Đã cập nhật trạng thái";
        await loadOrders();
      } catch (e) {
        msgEl.textContent = "Không kết nối được tới API";
      }
    }

    document.addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const id = tr.getAttribute("data-id");
      if (!id) return;
      const action = btn.getAttribute("data-action");
      if (action === "view") viewOrder(id);
      if (action === "cancel") cancelOrder(id);
      if (action === "update-status") {
        const sel = tr.querySelector('select[data-role="status"]');
        const status = sel ? sel.value : "";
        if (!status) return;
        updateOrderStatus(id, status);
      }
    });

    loadOrders();
  </script>
</body>
</html>
