<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - ThucPhamKhoe.com</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page-body">
  <div class="auth-container">
    <h2>Đăng nhập</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Mật khẩu" required />
      <button type="submit">Đăng nhập</button>
    </form>
    <div id="login-message" class="message"></div>
    <a href="register.html" class="back-link">Chưa có tài khoản? Đăng ký</a>
    <a href="index.html" class="back-link">&larr; Quay lại trang chủ</a>
  </div>

  <script src="analytics.js"></script>
  <script>
    const API_BASE = "http://localhost:3000";

    function getUserId() {
      try {
        const u = JSON.parse(localStorage.getItem("user") || "{}");
        return u && (u.id || u.email) ? String(u.id || u.email) : "guest";
      } catch (_) {
        return "guest";
      }
    }

    function cartSessionsKey() {
      return "cartSessions:" + getUserId();
    }

    function activeCartIdKey() {
      return "activeCartId:" + getUserId();
    }

    function getCartSessions() {
      try {
        const k = cartSessionsKey();
        const mine = JSON.parse(localStorage.getItem(k) || "[]");
        if (Array.isArray(mine)) return mine;
        return [];
      } catch (_) {
        return [];
      }
    }
    function saveCartSessions(sessions) {
      localStorage.setItem(cartSessionsKey(), JSON.stringify(Array.isArray(sessions) ? sessions : []));
    }
    function startNewCartSession(user) {
      const sessions = getCartSessions();

      // migrate legacy single cart into a session (keep it as an older cart)
      let legacy = [];
      try { legacy = JSON.parse(localStorage.getItem("cart") || "[]"); } catch (_) { legacy = []; }
      if (Array.isArray(legacy) && legacy.length > 0) {
        sessions.push({
          id: "cart_" + Date.now() + "_legacy",
          createdAt: new Date().toISOString(),
          userId: (user && (user.id || user.email)) ? String(user.id || user.email) : "guest",
          items: legacy
        });
        localStorage.removeItem("cart");
      }

      const id = "cart_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      sessions.push({
        id,
        createdAt: new Date().toISOString(),
        userId: (user && (user.id || user.email)) ? String(user.id || user.email) : getUserId(),
        items: []
      });
      saveCartSessions(sessions);
      localStorage.setItem(activeCartIdKey(), id);
    }

    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const messageEl = document.getElementById("login-message");
      messageEl.textContent = "";

      try {
        const res = await fetch(API_BASE + "/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!data.ok) {
          messageEl.textContent = data.message || "ĐĒng nhập thất bại";
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        if (data.user.role === "admin") {
          window.location.href = "admin-dashboard.html";
        } else if (data.user.role === "expert") {
          window.location.href = "expert-dashboard.html";
        } else {
          startNewCartSession(data.user);
          window.location.href = "index.html";
        }
      } catch (err) {
        console.error(err);
        messageEl.textContent = "Không kết n�i �ược t�:i server";
      }
    });
  </script>
</body>
</html>
